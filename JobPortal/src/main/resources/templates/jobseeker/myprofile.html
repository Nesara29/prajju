<!doctype html>
<html lang="en">
<head th:replace="base :: head">
     
</head>
<body>

<th:block th:replace="base :: header">
</th:block>
 
 
   <div class="container my-4">
        <div class="account-layout jobseeker">
            
            <div class="account-bdy">
                <div class="row"> 
                <th:block  th:replace="base :: jobseeker-sidenavbar"></th:block> 

<div class="col-sm-12 col-md-9 pl-md-0 pl-sm-3 ">
                          <div class="account-layout  border">
    <div class="account-hdr bg-primary text-white border">
     Dashboard
    </div>
    <div class="account-bdy p-3">
   
                            <form class="ajaxfrm" data-reload=1 data-reset=1 name="signup" id="peditfrm" method="post" action="/jobseeker/updateprofile"    enctype="multipart/form-data">


 

 

 <div class="d-flex text-center justify-content-center">
 <!-- Profile picture card-->
            <div class="card mb-4 mb-xl-0 col-md-6">
                <div class="card-header">Profile Picture</div>
                <div class="card-body text-center">
                    <!-- Profile picture image-->
                    <img class="img-account-profile rounded-circle mb-2 " id="profileimgsrc" th:src="${'/myprofileimage'}" alt="">
                    <!-- Profile picture help block-->
                    <div class="small font-italic text-muted mb-4">JPG or PNG no larger than 500kb</div>
                    <!-- Profile picture upload button-->
                     <span class="d-none">
                    <input type="file" accept="image/*" id="profileimg" name="profileimg">
                    </span>
                    <button class="btn btn-primary" type="button" onclick="$('#profileimg').click()">Upload new image</button>
                </div>
                </div>
            </div>
<div class="form-group">
<label>  Full Name</label>
<input class="form-control" type="text" name="fullname" th:value="${fullname}" autocomplete="off" required />
</div>
 

<div class="form-group">
<label>Mobile Number :</label>
<input class="form-control" type="text" name="mobileno" maxlength="10" th:value="${mobileno}" autocomplete="off" required />
</div>
                                        
<div class="form-group">
<label>  Email</label>
<input class="form-control" type="email" name="username" id="username" th:value="${username}"  autocomplete="off" required readonly />
</div> 
<div class="form-group">
<label>Address</label>
<textarea  class="form-control" name="address" id="address" th:text="${address}"></textarea>
</div> 
<div class="form-group">
<label>About Me</label>
<textarea  class="form-control" name="aboutme" id="aboutme" th:text="${aboutme}"></textarea>
</div> 
<div class="form-group">
<label>Single line subtitle for your profile page</label>
<input class="form-control" type="text" name="subtitle" th:value="${subtitle}" autocomplete="off" required />
</div>
<div class="form-group">
<label>Professional skills <span class="text-info">( If multiple separate with "," )</label>
<textarea  class="form-control" name="skills" id="skills" th:text="${skills}"></textarea>
</div> 
<div class="form-group">
<label>Education  </label>
<table class="table" id="educationinput">
                 <thead><tr><th>Institution/College</th><th>Course</th><th>From</th><th>To</th><th></th></tr></thead>
                 <tbody></tbody>                   
                </table> 
  <button id="edurowAdder" type="button" class="btn btn-dark w-25 float-right ">
                        <span class="bi bi-plus-square-dotted">
                        </span> ADD
                    </button>
</div> 
<br/><br/>
<br/>
<div class="form-group">
<label>Work Experience</label>
<table class="table" id="experienceinput">
                 <thead><tr><th>Company</th><th>Position</th><th>From</th><th>To</th><th></th></tr></thead>
                 <tbody></tbody>                   
                </table> 
  <button id="exprowAdder" type="button" class="btn btn-dark w-25 float-right ">
                        <span class="bi bi-plus-square-dotted">
                        </span> ADD
                    </button>
</div> <br/><br/>
<br/>
<div class="container">
<div class="msg msg-error  d-none" role="alert"  > 
</div> 
 
 
<div class="msg msg-success d-none" role="alert"  >  
</div>
 </div>
                 <div class="form-group mt-5 mb-5 text-right">             
                 <label> </label>
<button type="submit" name="update" class="btn btn-primary float-right w-50" id="submit">Update Now </button>
</div>
                                    </form>
                                    <div class="form-group row mt-3">
<label class="col">User ID : 
#<th:block th:text="${id}"></th:block> </label>
<label class="col">Reg Date :  
<th:block th:text="${regdate}"></th:block> </label>
<th:block th:if="${updationtime}"> 
<label class="col">Last Updation Time :  
<th:block th:text="${updationtime}"></th:block></label>
</div>
                            </div>
                        </div>
                            </div>
        </div> 
        </div>
        </div>
        </div>
        
     <!-- CONTENT-WRAPPER SECTION END-->
   <th:block   th:replace="base :: footer">
 
   </th:block> 
   <script th:inline="javascript">
/*<![CDATA[*/
   $('input[name=fullname]').on('keypress',function(event){
		 return validatealpha(event);		 
	 });  


$('input[name=mobileno]').on('keypress',function(event){
	 return validatemobile(event);		 
});	
   $('#profileimg').change(function(){
	   if (this.files && this.files[0]) {
	        var reader = new FileReader();
            if(this.files[0].size<=512000)
            	{
	        reader.onload = function (e) {
	            $('#profileimgsrc').attr('src', e.target.result);
	        }

	        reader.readAsDataURL(this.files[0]);
	    }
            else
            	{
            	this.files=null;
            	alert("File size should be below 500kb");
	   }
	   }
	   
   });
   var educount=0;
   var expcount=0;
   
    var educations=/*[[${educations}]]*/{};
    var experiences=/*[[${experiences}]]*/{};
   for(var i=0;i<educations.length;i++)
   {
	  addeducation(educount,educations[i]);
	  educount++;
   }
   for(var i=0;i<experiences.length;i++)
   {
	  addexperience(expcount,experiences[i]);
	  expcount++;
   }
   
   $("#edurowAdder").click(function () {
	   addeducation(educount);
	   educount++;
   });
   function addeducation(cnt,education={"institution":"","course":"","dtfrom":"","dtto":""}){
	   newRowAdd ="<tr><td><input name='institution[]' value='"+education.institution+"' required></td><td><input  value='"+education.course+"' name='course[]' required></td><td><input  value='"+education.dtfrom+"' type='date' name='efrom[]' required></td><td><input type='date'   value='"+education.dtto+"'  name='eto[]' required></td><td  role='button' onclick='this.parentNode.remove()'>x</td></tr>";
    
       $('#educationinput').append(newRowAdd);
   }
   
   $("#exprowAdder").click(function () {
	   addexperience(expcount);
	   educount++;
   });
   function addexperience(cnt,experience={"company":"","position":"","dtfrom":"","dtto":""})
   {
	   newRowAdd ="<tr><td><input name='company[]' value='"+experience.company+"' required></td><td><input name='position[]'  value='"+experience.position+"' required></td><td><input type='date'  value='"+experience.dtfrom+"' name='exfrom[]'></td><td><input type='date'   value='"+experience.dtto+"' name='exto[]'></td><td  role='button' onclick='this.parentNode.remove()'>x</td></tr>";
    
       $('#experienceinput').append(newRowAdd);
   }

   /*]]>*/
   </script>
   </body>
</html>
