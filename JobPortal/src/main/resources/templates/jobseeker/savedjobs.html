<!doctype html>
<html lang="en">
<head th:replace="base :: head">
     
</head>
<body>
<th:block th:replace="base :: header">
</th:block>
 
 
   <div class="container my-4">
        <div class="account-layout jobseeker">
             
            <div class="account-bdy">
                <div class="row"> 
                <th:block  th:replace="base :: jobseeker-sidenavbar"></th:block> 

<div class="col-sm-12 col-md-9 pl-md-0 pl-sm-3 ">
                          <div class="account-layout  border">
    <div class="account-hdr bg-primary text-white border">
      Saved Jobs
    </div>
    <div class="account-bdy p-3">
  <div class="row">
        <div class="col-sm-12 col-md-12">
          <div class="table-responsive pt-3">
            <table class="table table-hover table-striped small dataTable">
              <thead>
                <tr> 
                 <th>Job Position</th>
                  <th>Posted By</th> 
                  <th>Job Level</th> 
                  <th>No of vacancy</th> 
                  <th>Applied On</th> 
                  <th>Status</th> 
                </tr>
              </thead>
              <tbody> 
                <tr th:each="job:${jobs}">
                  <td th:text="${job.position}"></td>
                  <td th:text="${job.postedby}"></td>
                  <td th:text="${job.level}"></td>
                  <td th:text="${job.vacancy}"></td>
                  <td th:text="${job.appliedon}"></td>
                  <td th:text="${job.status==1?'Live':'Closed'}"></td>
                   
                </tr> 
                <tr th:unless="${jobs}">
                  <th colspan=5>There isn't any jobs.</th> 
                </tr> 
              </tbody>
            </table>
          </div>
         
        </div>
      </div>
   
      
          </div>
  </div>
         </div>
            </div>
        </div>
    </div> 
    </div>
    
	   <th:block   th:replace="base :: footer">
 
   </th:block>
</body>
</html>
