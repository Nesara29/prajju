<!doctype html>
<html  lang="en">
<head th:replace="base :: head">
     
</head>
<body>
 
 <th:block th:replace="base :: header">
</th:block>

 
  
  <section class="jobs-section py-5">
 <div class="container">
    <section class="job-section">
    <div class="app-component mb-5">
    <div class="container-fluid px-0 mb-2">
        <section  class="search-bar mt-2 px-0 border">
            <div  class="py-4">
                <div  class="row">
                    <div  class="col-md-6 offset-md-3">
                        <form action="/search" method="post">
                            <div  class="row m-1">
                                <div  class="col-md-12 input-group">
                                    <input  type="text" th:value="${jobtitle}" name="jobtitle" placeholder="Search By Job Title" class="form-control"> <span  class="input-group-append"><button  class="btn btn-success pt-1"><span  class="icon-search"></span> Search Jobs
                                    </button>
                                    </span>
                                </div>
                            </div>
                        </form>
                    </div>
                    
                </div>
            </div>
        </section>
    </div> 
 
</div>
    
    
</section>  

<section class="jobs-section"> 
      <div class="row ">
        <div class="col-sm-12  ml-auto">
          <div class="card">
            <div class="card-header">
              <p class="card-title font-weight-bold"><i class="fas fa-briefcase m-2"></i>Search Results : <span th:text="${count}"></span> Job(s)</p>
            </div>
            <div class="card-body">
              <div class="top-jobs" >
                <div class="row">

                       <div class="col-md-6 m-2" th:each="j:${jobs}">
                      <a th:href="${'/viewjob/'+j.id}">
                      <div class="job-item border row h-100">
                        <div class="col-xs-2 col-sm-2 col-md-3">
                          <img th:src="${'/viewprofileimage/'+j.postedbyid}" alt="job listings" class="img-fluid p-2 img-logo rounded-circle">
                        </div>
                        <div class="job-description col-xs-9 col-sm-9 col-md-9">
                        <p class="company-name float-left col-6">
                            <span th:title="${j.postedby}" th:text="${j.postedby}"></span>
                            </p>
                         <p class="float-right col-6 small">    
                            Posted on   <span th:text="${j.postedon}"></span>
                        </p>
                          <ul class="company-listings col-md-12 float-left">
                            <li  th:text="${j.title}"></li>
                            <li   th:text="${j.catg}"></li>  
                        </ul>
                        </div>
                          <div class="job-description col-md-12 text-center"> 
                          <ul class="company-listings"> 
                            <li class="float-left w-25" th:text="${j.etype}"></li>
                            <li class="float-left w-25" th:text="${j.salary}"></li>
                            <li class="float-left w-50 mb-3" th:text="${j.location}"></li>
                        </ul>
                        </div>
                      </div>
                      </a>
                    </div>
                  
                 </div>
               </div>
              </div>
            
            </div>
          </div>
 </div>
 </section> 
   </div>
   </section>
   <th:block   th:replace="base :: loginlinksfooter"> 
   </th:block>  
   <th:block   th:replace="base :: footer"> 
   </th:block>
    
</body>
</html>
