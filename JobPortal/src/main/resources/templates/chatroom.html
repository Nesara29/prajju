<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"> 
       <head th:replace="base :: head">
     
</head>   
	<body>
	 <th:block th:replace="base :: header">
</th:block>
		<div class="container-fluid h-100">
			<div class="row justify-content-center h-100">
				<div class="col-md-4 col-xl-3 chat">
				<div class="card mb-sm-3 mb-md-0 contacts_card">
					<div class="card-header">
						<div class="input-group">
							<input type="text" placeholder="Search..." name="" class="form-control search">
							<div class="input-group-prepend">
								<span class="input-group-text search_btn"><i class="fas fa-search"></i></span>
							</div>
						</div>
					</div>
					<div class="card-body contacts_body">
						<ui class="contacts">
						
					 
						</ui>
					</div>
					<div class="card-footer">
					
					</div>
				</div></div>
				<div class="col-md-8 col-xl-6 chat">
					<div class="card"> 
						<div class="card-body msg_card_body" id="#msg_card_body">
							
							 
						</div>
						<div class="card-footer">
							<div class="input-group">
								<div class="input-group-append">
									<span class="input-group-text attach_btn"><i class="fas fa-paperclip"></i></span>
								</div>
								<textarea name="" class="form-control type_msg" placeholder="Type your message..."></textarea>
								<div class="input-group-append">
									<span onclick="send()" class="input-group-text send_btn"><i class="fas fa-location-arrow"></i></span>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<style>
			body,html{
			height: 100%;
			margin: 0;
			background: #7F7FD5;
	       background: -webkit-linear-gradient(to right, #91EAE4, #86A8E7, #7F7FD5);
	        background: linear-gradient(to right, #91EAE4, #86A8E7, #7F7FD5);
		}

		.chat{
			margin-top: auto;
			margin-bottom: auto;
		}
		.card{
			height: 500px;
			border-radius: 15px !important;
			background-color: rgba(0,0,0,0.4) !important;
		}
		.contacts_body{
			padding:  0.75rem 0 !important;
			overflow-y: auto;
			white-space: nowrap;
		}
		.msg_card_body{
			overflow-y: auto;
		}
		.card-header{
			border-radius: 15px 15px 0 0 !important;
			border-bottom: 0 !important;
		}
	 .card-footer{
		border-radius: 0 0 15px 15px !important;
			border-top: 0 !important;
	}
		.container{
			align-content: center;
		}
		.search{
			border-radius: 15px 0 0 15px !important;
			background-color: rgba(0,0,0,0.3) !important;
			border:0 !important;
			color:white !important;
		}
		.search:focus{
		     box-shadow:none !important;
           outline:0px !important;
		}
		.type_msg{
			background-color: rgba(0,0,0,0.3) !important;
			border:0 !important;
			color:white !important;
			height: 60px !important;
			overflow-y: auto;
		}
			.type_msg:focus{
		     box-shadow:none !important;
           outline:0px !important;
		}
		.attach_btn{
	border-radius: 15px 0 0 15px !important;
	background-color: rgba(0,0,0,0.3) !important;
			border:0 !important;
			color: white !important;
			cursor: pointer;
		}
		.send_btn{
	border-radius: 0 15px 15px 0 !important;
	background-color: rgba(0,0,0,0.3) !important;
			border:0 !important;
			color: white !important;
			cursor: pointer;
		}
		.search_btn{
			border-radius: 0 15px 15px 0 !important;
			background-color: rgba(0,0,0,0.3) !important;
			border:0 !important;
			color: white !important;
			cursor: pointer;
		}
		.contacts{
			list-style: none;
			padding: 0;
		}
		.contacts li{
			width: 100% !important;
			padding: 5px 10px;
			margin-bottom: 15px !important;
		}
	.active{
			background-color: rgba(0,0,0,0.3);
	}
		.user_img{
			height: 70px;
			width: 70px;
			border:1.5px solid #f5f6fa;
		
		}
		.user_img_msg{
			height: 40px;
			width: 40px;
			border:1.5px solid #f5f6fa;
		
		}
	.img_cont{
			position: relative;
			height: 70px;
			width: 70px;
	}
	.img_cont_msg{
			height: 40px;
			width: 40px;
	}
	.online_icon{
		position: absolute;
		height: 15px;
		width:15px;
		background-color: #4cd137;
		border-radius: 50%;
		bottom: 0.2em;
		right: 0.4em;
		border:1.5px solid white;
	}
	.offline{
		background-color: #c23616 !important;
	}
	.user_info{
		margin-top: auto;
		margin-bottom: auto;
		margin-left: 15px;
		position:relative;
	}
	.contacts .msg_time{
	  font-size:10px;
	}
	.user_info span{
		font-size: 20px;
		color: white;
	}
	.user_info p{
	font-size: 10px;
	color: rgba(255,255,255,0.6);
	}
	.video_cam{
		margin-left: 50px;
		margin-top: 5px;
	}
	.video_cam span{
		color: white;
		font-size: 20px;
		cursor: pointer;
		margin-right: 20px;
	}
	.msg_cotainer{
		margin-top: auto;
		margin-bottom: auto;
		margin-left: 10px;
		border-radius: 25px;
		background-color: #82ccdd;
		padding: 10px;
		position: relative;
		width:50%;
	}
	.msg_cotainer_send{
		margin-top: auto;
		margin-bottom: auto;
		margin-right: 10px;
		border-radius: 25px;
		background-color: #78e08f;
		padding: 10px;
		position: relative;
		width: 50%;
	}
	.msg_time{
		position: absolute;
		left: 20px;
		bottom: -15px;
		color: rgba(255,255,255,0.5);
		font-size: 10px;
	}
	.msg_time_send{
		position: absolute;
		right:0;
		bottom: -15px;
		color: rgba(255,255,255,0.5);
		font-size: 10px;
	}
	.msg_head{
		position: relative;
	}
	#action_menu_btn{
		position: absolute;
		right: 10px;
		top: 10px;
		color: white;
		cursor: pointer;
		font-size: 20px;
	}
	.action_menu{
		z-index: 1;
		position: absolute;
		padding: 15px 0;
		background-color: rgba(0,0,0,0.5);
		color: white;
		border-radius: 15px;
		top: 30px;
		right: 15px;
		display: none;
	}
	.action_menu ul{
		list-style: none;
		padding: 0;
	margin: 0;
	}
	.action_menu ul li{
		width: 100%;
		padding: 10px 15px;
		margin-bottom: 5px;
	}
	.action_menu ul li i{
		padding-right: 10px;
	
	}
	.action_menu ul li:hover{
		cursor: pointer;
		background-color: rgba(0,0,0,0.2);
	}
	@media(max-width: 576px){
	.contacts_card{
		margin-bottom: 15px !important;
	}
	}
		</style>
		<script>
		window.onbeforeunload = function() {
			disconnect();
		};
		$(document).ready(function(){
			$('#action_menu_btn').click(function(){
				$('.action_menu').toggle();
			});
			 
			connect();
				});
		    var contacttpl='<li class="active"> <div class="d-flex bd-highlight"> <div class="img_cont"> <img  src="/viewprofileimage/{{id}}" class="rounded-circle user_img"> <span class="online_icon"></span> </div> <div class="user_info"> <span>{{name}}</span> <span class="msg_time">{{time}}</span> </div> </div> </li>';
		    var infotpl='<div class="d-flex justify-content-start mb-4"> <div class="img_cont_msg"> <img src="/viewprofileimage/{{id}}" class="rounded-circle user_img_msg"> </div> <div class="msg_cotainer"> {{message}} <span class="msg_time">{{time}}</span> </div> </div>';
		    var mmsgtpl='<div class="d-flex justify-content-start mb-4"> <div class="img_cont_msg"> <img src="/viewprofileimage/{{id}}" class="rounded-circle user_img_msg"> </div> <div class="msg_cotainer"> {{message}} <span class="msg_time">{{time}}</span> </div> </div>';
		    var msgtpl='<div class="d-flex justify-content-end mb-4"> <div class="msg_cotainer_send"> {{message}} <span class="msg_time_send">{{time}}</span> </div> <div class="img_cont_msg"> <img src="/viewprofileimage/{{id}}" class="rounded-circle user_img_msg"> </div> </div> ';
            var ws;
            /*<![CDATA[*/
            var url ='/web-socket';
            var uname="[[${uname}]]";
            var uid="[[${uid}]]";
            /*]]>*/
            function setConnected(connected) {
                $("#connect").prop("disabled", connected);
                $("#disconnect").prop("disabled", !connected);
                if (connected) {
                    $("#sendmessage").show();
                } else {
                    $("#sendmessage").hide();
                }
            }
 
            function connect() {
             
                ws = new WebSocket(url);
                ws.onopen = function () {
                	 
                	var chatMessage = {
                            sender: uname,
                            message: 'Connected',
                            uid:uid,
                            type: 'JOIN',
                            time:new Date().toLocaleTimeString()
                        };
                	 ws.send(JSON.stringify(chatMessage)); 
                 	informchatroom(chatMessage);
                };
                ws.onmessage = function (data) {
                	var data = JSON.parse(data.data);
                    showBroadcastMessage(data);
                };
                setConnected(true);
            }
 
            function disconnect() {
                if (ws != null) {
                	var chatMessage = {
                            sender: uname,
                            message: 'Disconnected',
                            uid:uid,
                            type: 'LEAVE',
                            time:new Date().toLocaleTimeString()
                        };
                	informchatroom(chatMessage);
                	 ws.send(JSON.stringify(chatMessage));
                     ws.close();
                    
                }
                setConnected(false);
            }            
 
            function send() {
            	var chatMessage = {
                        sender: uname,
                        message: $(".type_msg").val(),
                        uid:uid,
                        type: 'CHAT',
                        time:new Date().toLocaleTimeString()
                    };
            	informchatroom(chatMessage);
                ws.send(JSON.stringify(chatMessage));
                $(".type_msg").val(""); 
               
            }
 
            function showinfo(data)
            {
            	var strhtml=infotpl.replace("{{id}}",data.uid);
            	strhtml=strhtml.replace("{{message}}",data.message);
            	strhtml=strhtml.replace("{{time}}",data.time);
            	$(".contacts_card .card-footer").html(strhtml);
            }
            
            function showmymessage(data)
            {
            	var strhtml=mmsgtpl.replace("{{id}}",data.uid);
            	strhtml=strhtml.replace("{{message}}",data.message);
            	strhtml=strhtml.replace("{{time}}",data.time);
            	$(".chat .msg_card_body").append(strhtml);
            }
            
            function showmessage(data)
            {
            	var strhtml=msgtpl.replace("{{id}}",data.uid);
            	strhtml=strhtml.replace("{{message}}",data.message);
            	strhtml=strhtml.replace("{{time}}",data.time);
            	$(".chat .msg_card_body").append(strhtml);
            }
            
            function showBroadcastMessage(data) { 
            	switch(data.type)
            	{
            	case 'JOIN':showinfo(data);refreshcontacts();break;
            	case 'LEAVE':showinfo(data);refreshcontacts();break;
            	case 'CHAT':
            		if(data.uid==uid)
            			showmymessage(data);
            		else
            			showmessage(data);
            		const element = document.getElementById("#msg_card_body");
                    element.scrollTop = element.scrollHeight;   
            		break;
            	} 
            	
            }
            
            function informchatroom(data)
            {
            	$.ajax({
		            type: "POST",
		            url: "/chatroom/inform",  
		            data:data,
		 		    dataType: "json",
		            success: function(data)
		            {
		            	refreshcontacts();
		            }
		            }); 
            }
            
            function refreshcontacts()
            {
            	$.ajax({
		            type: "POST",
		            url: "/chatroom/onlinelist",   
		 		    dataType: "json",
		            success: function(data)
		            {
		            	var strhtml="";
		            	$(".contacts_body .contacts").html('');
		            	for(var i=0;i<data.length;i++)
		            		{
		            		strhtml=contacttpl.replace("{{id}}",data[i].uid);
		                	strhtml=strhtml.replace("{{name}}",data[i].uname);
		                	strhtml=strhtml.replace("{{time}}",data[i].time);
		                	$(".contacts_body .contacts").append(strhtml);
		            		}
		            }
		            }); 
            }
            setInterval(refreshcontacts,5000);
        </script>
    </body>
</html>
