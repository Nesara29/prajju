<!doctype html>
<html  lang="en">
<head th:replace="base :: head">
     
</head>
<body>
 
 <th:block th:replace="base :: header">
</th:block>

<section class="home-page pt-4">
    <div class="container">
      <form action="/search" method="post">
        <div class="row">
          <div class="col-sm-12 col-md-6">
            <div class="px-4">
              <div class="rounded-text">
                <p>
                  Find jobs, vacancy, career online.
                </p>
              </div>
              <div class="home-search-bar">
                  <input type="text" name="jobtitle" placeholder="Search Job By Title" class="home-search-input form-control">
                  <button type="submit" class="secondary-btn"><i class="fas fa-search"></i></button>
              </div>
            </div>
          </div>
          <div class="col-sm-12 col-md-6">
            <div class="py-5 px-5 text-center">
              <div class="text-light">
                <h4>A dream doesn't become reality through magic, it takes sweat, determination and hard work.
              </h4>
              </div>
            </div>
            </div>
        </div>   
      </form>
    </div>
  </section>
  
  
  <section class="jobs-section py-5">
    <div class="container-fluid px-0">
      <div class="row ">
        <div class="col-sm-12 col-md-7 ml-auto">
          <div class="card">
            <div class="card-header">
              <p class="card-title font-weight-bold"><i class="fas fa-briefcase"></i> Top jobs</p>
            </div>
            <div class="card-body">
              <div class="top-jobs" >
                <div class="row">

                       <div class="col-md-12 m-2" th:each="j:${jobs}">
                      <a th:href="${'/viewjob/'+j.id}">
                      <div class="job-item border row h-100">
                        <div class="col-xs-2 col-sm-2 col-md-3">
                          <img th:src="${'/viewprofileimage/'+j.postedbyid}" alt="job listings" class="img-fluid p-2">
                        </div>
                        <div class="job-description col-xs-9 col-sm-9 col-md-9">
                        <p class="company-name" th:title="${j.postedby}" th:text="${j.postedby}"></p>
                          <ul class="company-listings">
                            <li class="" th:text="${j.title}"></li>
                            <li class="mb-4"  th:text="${j.catg}"></li> 
                            <li class="float-left w-25" th:text="${j.etype}"></li>
                            <li class="float-left w-25" th:text="${j.salary}"></li>
                            <li class="float-left w-25" th:text="${j.location}"></li>
                        </ul>
                        </div>
                      </div>
                      </a>
                    </div>
                  
                 </div>
               </div>
              </div>
              <a class="btn secondary-btn" href="/search">Show all jobs</a>
            </div>
          </div>
       
        <div class="col-sm-12 col-md-3 mr-auto">

          <div class="card mb-4">
            <div class="card-header">
              <p class="font-weight-bold"><i class="fas fa-building"></i> Top Employers</p>
            </div>
            <div class="card-body">
              <div class="top-employers">
                              <div class="top-employer" th:each="c:${companies}">
                  <a th:href="${'/fromcompany/'+c.id}">
                    <img th:src="${'/viewprofileimage/'+c.id}" th:title="${c.company}" width="60px" class="img-fluid" alt="">
                  </a>
                </div> 
                 
                            </div>
            </div>
          </div>

            <div class="card mb-4 job-by-category">
              <div class="card-header">
                <p class="font-weight-bold"><i class="fab fa-typo3"></i> Jobs By Category</p>
              </div>
              <div class="card-body">
                <div class="jobs-category mb-3 mt-0">
                                    <div  th:each="c,i:${jobcategories}" th:class="${'hover-shadow p-1 '+(i.index>5?' d-none':'')}"><a th:href="${'/fromcategory/'+c.id}" class="text-muted" th:text="${c.name}"></a> </div>
                                    <a class="acc-more text-primary" role="button">Show more</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
  </section> 
   
   <th:block   th:replace="base :: loginlinksfooter"> 
   </th:block>  
   <th:block   th:replace="base :: footer"> 
   </th:block>
   <script>
   document.querySelectorAll(".acc-more").forEach(el=>{
	     const hidden= el.parentElement.querySelectorAll(".d-none");
	     el.addEventListener("click", ()=>{
	      hidden.forEach(h=> h.classList.toggle("d-none")) 
	      if (hidden[0].classList.contains("d-none"))
	          el.innerHTML = "Show more";
	        else el.innerHTML = "Show less";
	     });
	    });
   </script>
</body>
</html>
