<!doctype html>
<html lang="en">
<head th:replace="base :: head">
     
</head>
<body>
<th:block th:replace="base :: header">
</th:block>
 
 
   <div class="container my-4">
        <div class="account-layout admin">
             
            <div class="account-bdy">
                <div class="row"> 
                <th:block  th:replace="base :: admin-sidenavbar"></th:block> 

<div class="col-sm-12 col-md-9 pl-md-0 pl-sm-3 ">
                          <div class="account-layout  border">
    <div class="account-hdr bg-primary text-white border">
      Employers
    </div>
    <div class="account-bdy p-3">
  <div class="row">
        <div class="col-sm-12 col-md-12">
          <div class="table-responsive pt-3">
            <table class="table table-hover table-striped small dataTable">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Mobile</th>
                  <th>created on</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody> 
                <tr th:each="user:${regusers}">
                  <td th:text="${user.id}"></td>
                  <td th:text="${user.fullname}"></td>
                  <td th:text="${user.emailid}"></td>
                  <td th:text="${user.mobile}"></td>
                  <td th:text="${user.regdate}"></td>
                  <td>
                  <th:block th:if="${user.status==1}">
<a href='#' class='dialoganchor' th:data-href="${'/admin/changeuserstatus/'+user.id+'/0'}" onclick="return confirm('Are you sure you want to block this user?');" >  <button class="btn btn-danger"> Inactivate</button>
</a>
</th:block>
  <th:block th:unless="${user.status==1}"> 

                                            <a  class='dialoganchor' href='#' th:data-href="${'/admin/changeuserstatus/'+user.id+'/1'}" onclick="return confirm('Are you sure you want to active this user?');"><button class="btn btn-primary"> Activate</button> 
                                          </a>
                                          
                                          </th:block>
                  
                  </td> 
                </tr> 
                <tr th:unless="${regusers}">
                  <th colspan=5>There isn't any employers.</th> 
                </tr> 
              </tbody>
            </table>
          </div>
         
        </div>
      </div>
   
      
          </div>
  </div>
         </div>
            </div>
        </div>
    </div> 
    </div>
    
	   <th:block   th:replace="base :: footer">
 
   </th:block>
</body>
</html>
