<!doctype html>
<html lang="en">
<head th:replace="base :: head">
     
</head>
<body>
<th:block th:replace="base :: header">
</th:block>
 
 
   <div class="container my-4">
        <div class="account-layout employer">
             
            <div class="account-bdy">
                <div class="row"> 
                <th:block  th:replace="base :: employer-sidenavbar"></th:block> 

<div class="col-sm-12 col-md-9 pl-md-0 pl-sm-3 ">
                          <div class="account-layout  border">
    <div class="account-hdr bg-primary text-white border">
     <span th:text="${appcount}"></span> Job Application(s) for '<span th:text="${job.jobtitle}"></span>'
      
          </div>
    <div class="account-bdy p-3">
  <div class="row">
        <div class="col-sm-12 col-md-12">
        
         <ul class="nav nav-tabs" role="tablist">
                     <li class="nav-item ">
                        <a class="nav-link active" href="#app-tab" role="tab" data-toggle="tab">Applied</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#acc-tab" role="tab" data-toggle="tab"><span th:text="${#lists.size(accepted)}"></span> Accepted</a>
                    </li>
                      <li class="nav-item">
                        <a class="nav-link" href="#rej-tab" role="tab" data-toggle="tab"><span th:text="${#lists.size(rejected)}"></span> Rejected</a>
                    </li>
                    
                </ul>

                <!-- Tab panes -->
                <div class="tab-content">
                    <br>
                    
                       
         <div role="tabpanel" class="tab-pane active" id="app-tab">
        
        
          <div class="table-responsive pt-3">
            <table class="table table-hover table-striped small dataTable">
              <thead>
                <tr> 
                  <th>Name</th>
                  <th>Email</th>
                  <th>Mobile</th>
                  <th>Applied on</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody> 
                <tr th:each="user:${applied}"> 
                  <td th:text="${user.fullname}"></td>
                  <td th:text="${user.emailid}"></td>
                  <td th:text="${user.mobile}"></td>
                  <td th:text="${user.appliedon}"></td>
                   <td><a target="_blank" th:href="${'/viewjobseeker/'+user.uid}">
                          <i class="fas fa-eye"></i>
                        </a><a th:data-href="${'/employer/changeapplicationstatus/1/'+user.id}" class="dialoganchor">
                          <i class="fas fa-check m-3"></i>
                        </a> <a th:data-href="${'/employer/changeapplicationstatus/2/'+user.id}" class="dialoganchor">
                          <i class="fas fa-window-close"></i>
                        </a></td>
                </tr> 
                <tr th:unless="${applied}">
                  <th colspan=5>There isn't any data.</th> 
                </tr> 
              </tbody>
            </table>
          </div>
         </div>
         
                    
                    <div role="tabpanel" class="tab-pane" id="acc-tab">
        
        
          <div class="table-responsive pt-3">
            <table class="table table-hover table-striped small dataTable">
              <thead>
                <tr> 
                  <th>Name</th>
                  <th>Email</th>
                  <th>Mobile</th>
                  <th>Applied on</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody> 
                <tr th:each="user:${accepted}"> 
                  <td th:text="${user.fullname}"></td>
                  <td th:text="${user.emailid}"></td>
                  <td th:text="${user.mobile}"></td>
                  <td th:text="${user.appliedon}"></td>
                 <td><a target="_blank" th:href="${'/viewjobseeker/'+user.uid}">
                          <i class="fas fa-eye"></i>
                        </a> <a th:data-href="${'/employer/changeapplicationstatus/2/'+user.id}" class="dialoganchor">
                          <i class="fas fa-window-close  m-3"></i>
                        </a></td>
                </tr> 
                <tr th:unless="${accepted}">
                  <th colspan=5>There isn't any data.</th> 
                </tr> 
              </tbody>
            </table>
          </div>
         
         </div>
         
         <div role="tabpanel" class="tab-pane" id="rej-tab">
        
        
          <div class="table-responsive pt-3">
            <table class="table table-hover table-striped small dataTable">
              <thead>
                <tr> 
                  <th>Name</th>
                  <th>Email</th>
                  <th>Mobile</th>
                  <th>Applied on</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody> 
                <tr th:each="user:${rejected}"> 
                  <td th:text="${user.fullname}"></td>
                  <td th:text="${user.emailid}"></td>
                  <td th:text="${user.mobile}"></td>
                  <td th:text="${user.appliedon}"></td>
                  <td><a target="_blank" th:href="${'/viewjobseeker/'+user.uid}">
                          <i class="fas fa-eye"></i>
                        </a> <a th:data-href="${'/employer/changeapplicationstatus/1/'+user.id}" class="dialoganchor">
                          <i class="fas fa-check  m-3"></i>
                        </a></td>
                </tr> 
                <tr th:unless="${rejected}">
                  <th colspan=5>There isn't any data.</th> 
                </tr> 
              </tbody>
            </table>
          </div>
         </div>
         
         </div>
        </div>
      </div>
   
      
          </div>
  </div>
         </div>
            </div>
        </div>
    </div> 
    </div>
    
	   <th:block   th:replace="base :: footer">
 
   </th:block>
</body>
</html>
