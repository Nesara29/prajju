<!doctype html>
<html lang="en">
<head th:replace="base :: head">
     
</head>
<body>
<th:block th:replace="base :: header">
</th:block>
 
 
   <div class="container my-4">
        <div class="account-layout employer">
          
            <div class="account-bdy">
                <div class="row"> 
                <th:block  th:replace="base :: employer-sidenavbar"></th:block> 

<div class="col-sm-12 col-md-9 pl-md-0 pl-sm-3 ">
                          <div class="account-layout  border">
    <div class="account-hdr bg-primary text-white border">
      Change Password
    </div>
    <div class="account-bdy p-3">
           <div class="container">
<div class="msg msg-error" role="alert" th:if="${updatepassword_errors}" th:text="${updatepassword_errors}"> 
</div> 
 
 
<div class="msg msg-success" role="alert"  th:if="${updatepassword_success}" th:text="${updatepassword_success}">  
</div>
 </div>
      <form action="/employer/updatepassword" method="POST">
             <div class="form-group">
          <input type="password" placeholder="Current Password *" class="form-control " name="password" value="" required>
                    </div>
        <p class="mt-3  alert alert-primary">Password must be 8 characters with atleast a special character, a digit,  a lower case letter and an upper case letter </p>
        <div class="form-group">
          <input type="password" placeholder="New Password*" class="form-control " name="newpassword" value="" required>
                    </div>
        <div class="form-group">
          <input type="password" placeholder="Confirm Password *" class="form-control " name="confirmpassword" value="" required>
                    </div>
        <div class="line-divider"></div>
        <div class="mt-3">
          <button type="submit" class="btn primary-btn">Change Password</button> 
        </div>
      </form>

    </div>
  </div>
         </div>
            </div>
        </div>
    </div> 
    </div>
    
	   <th:block   th:replace="base :: footer">
 
   </th:block>
</body>
</html>
